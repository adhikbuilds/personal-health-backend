[build]
builder = "nixpacks"

[deploy]
startCommand = "gunicorn api_server:app --worker-class uvicorn.workers.UvicornWorker --workers 2 --bind 0.0.0.0:$PORT --timeout 120 --graceful-timeout 30"
healthcheckPath = "/livez"
healthcheckTimeout = 10
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
